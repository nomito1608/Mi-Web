<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Tellcenter</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Banner Dinámico Global -->
    <div class="dynamic-banner">
        <span id="dynamic-text" class="banner-text">Cargando novedades...</span>
    </div>

    <!-- Header Público -->
    <header class="public-header">
        <a href="index.html" class="logo-freelance">TELLCENTER <span>HUB</span></a>
        <nav class="public-nav">
            <a href="servicios.html">Servicios</a>
            <a href="contacto.html">Contacto</a>
            <a href="acceso_empleados.html" class="btn-login">Acceso Empleados</a>
        </nav>
    </header>

    <!-- Sección del Formulario: contacto para personas externas a la empresa -->
    <div class="contact-hero">
        <div class="contact-form-container">
            <h2>Contáctanos</h2>
            <p>¿Eres parte de otra empresa o quieres más información sobre nuestros servicios? Escríbenos y nuestro equipo se pondrá en contacto contigo a la brevedad.</p>

            <form action="#" method="POST" class="custom-form">
                <label for="nombre">Nombre completo *</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="puesto">Puesto laboral *</label>
                <input type="text" id="puesto" name="puesto" required>

                <label for="compania">Compañía *</label>
                <input type="text" id="compania" name="compania" required>

                <label for="telefono">Teléfono *</label>
                <div class="phone-row">
                    <select id="pais" name="pais">
                        <option value="+503">🇸🇻 +503</option>
                        <option value="+502">🇬🇹 +502</option>
                        <option value="+504">🇭🇳 +504</option>
                        <option value="+505">🇳🇮 +505</option>
                        <option value="+506">🇨🇷 +506</option>
                    </select>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>

                <label for="correo">Correo electrónico *</label>
                <input type="email" id="correo" name="correo" required>

                <label for="servicio">Servicios de interés *</label>
                <select id="servicio" name="servicio" required>
                    <option value="private_space">Private Space</option>
                    <option value="cloud">Servidores en la Nube</option>
                    <option value="soporte">Soporte IT</option>
                    <option value="ecommerce">Diseño &amp; E-commerce</option>
                </select>

                <button type="submit" class="btn-submit">Enviar</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
