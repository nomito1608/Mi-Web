<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Empleados | Tellcenter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style_login.css">
</head>
<body>

    <main class="login-page">

        <!-- ===== PANEL IZQUIERDO: foto + logo ===== -->
        <aside class="login-brand"></aside>
        <!-- ===== PANEL DERECHO: formulario ===== -->
        <section class="login-panel">
            <form class="login-form" id="login-form" novalidate>
                <p class="login-title">Tellcenter · Portal de Empleados</p>

                <label for="correo">Correo corporativo</label>
                <input type="email" id="correo" name="correo" placeholder="nombre@tellcenter.com" autocomplete="username">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password">

                <!-- Se muestra si el correo o la contraseña no coinciden -->
                <p class="login-error" id="login-error" role="alert">Correo o contraseña incorrectos. Intenta de nuevo.</p>

                <button type="submit" class="btn-login">Ingresar</button>

                <p class="login-help">¿Problemas para entrar? <a href="#">Contacta a Soporte IT</a></p>
                <p class="login-forgot"><a href="#">🔒 ¿Olvidaste tu contraseña?</a></p>
            </form>

            <a href="index.html" class="login-back">&larr; Volver al sitio</a>
        </section>

    </main>

    <script src="js/login.js"></script>
</body>
</html>
