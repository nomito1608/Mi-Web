<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tellcenter</title>
    <!-- Enlace a tu hoja de estilos original -->
    <link rel="stylesheet" href="css/style_login.css">
</head>
<body>

    <main class="login-page">
        
        <!-- ===== PANEL IZQUIERDO: foto + logo ===== -->
        <aside class="login-brand"></aside>
        
        <!-- ===== PANEL DERECHO: formulario ===== -->
        <section class="login-panel">
            <form id="loginForm" class="login-form" novalidate>
                <p class="login-title">Tellcenter · Portal de Empleados</p>
                
                <label for="correo">Correo corporativo</label>
                <input type="email" id="correo" name="correo" placeholder="nombre@tellcenter.com" autocomplete="username">
                
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password">
                
                <!-- Mensaje de error oculto por defecto -->
                <p class="login-error" id="login-error" role="alert" style="display: none; color: #dc2626; font-size: 0.9em; margin-bottom: 10px;">
                    Correo o contraseña incorrectos. Intenta de nuevo.
                </p>
                
                <button type="submit" class="btn-login">Ingresar</button>
                
                <p class="login-help">¿Problemas para entrar? <a href="#">Contacta a Soporte IT</a></p>
                <p class="login-forgot"><a href="#">¿Olvidaste tu contraseña?</a></p>
            </form>

            <a href="index.html" class="login-back">&larr; Volver al sitio</a>
        </section>

    </main>

    <!-- SCRIPT DE VALIDACIÓN -->
   <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const correo = document.getElementById('correo').value;
        const password = document.getElementById('password').value;
        const mensajeError = document.getElementById('login-error');

        if (correo.toLowerCase().includes('fredy') && password === '123') {
            mensajeError.style.display = 'none';
            
            // NUEVO: Guardar confirmación de sesión en el navegador
            sessionStorage.setItem('sesionIniciada', 'true');
            sessionStorage.setItem('usuario', 'Fredy');
            
            window.location.href = 'perfil_fredy.html';
        } else {
            mensajeError.style.display = 'block';
        }
    });
</script>
</body>
</html>
